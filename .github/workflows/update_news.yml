name: Botu Çalıştır ve Haberleri Güncelle

on:
  schedule:
    - cron: '0 */3 * * *' # Her 3 saatte bir otomatik çalışır
  workflow_dispatch: # Manuel olarak da tetiklenebilir

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Klonla
      uses: actions/checkout@v3

    - name: Python Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Bağımlılıkları Yükle (Requirements)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Botu Çalıştır
      run: python bot.py

    - name: Değişiklikleri Kaydet ve Gönder (Commit)
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add news.json
        git diff --staged --quiet || git commit -m "Otomatik haber güncellemesi: $(date +'%Y-%m-%d %H:%M:%S')"
        git push
