name: Update Sports News

on:
  schedule:
    # 3 saatte bir çalışır
    - cron: '0 */3 * * *'
  workflow_dispatch: # Manuel olarak istediğiniz zaman "Run workflow" diyerek tetikleyebilirsiniz

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser

      - name: Run script
        run: python sports_news.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sports_news.json
          git commit -m "Otomatik haber güncellemesi: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push
