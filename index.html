<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Plus Spor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-card: rgba(255,255,255,0.04);
            --bg-card-hover: rgba(255,255,255,0.08);
            --bg-glass: rgba(255,255,255,0.06);
            --border-color: rgba(255,255,255,0.08);
            --border-hover: rgba(255,255,255,0.15);
            --text-primary: #f1f1f7;
            --text-secondary: #9a9ab5;
            --text-muted: #5e5e7a;
            --accent-1: #6c5ce7;
            --accent-2: #a855f7;
            --accent-3: #ec4899;
            --accent-4: #f43f5e;
            --glow-1: rgba(108,92,231,0.3);
            --shadow-card: 0 8px 32px rgba(0,0,0,0.3);
            --shadow-card-hover: 0 20px 60px rgba(0,0,0,0.5);
            --navbar-bg: rgba(10,10,26,0.8);
            --ticker-bg: rgba(244,63,94,0.1);
            --detail-bg: #0e0e22;
        }
        [data-theme="light"] {
            --bg-primary: #f0f0f8;
            --bg-secondary: #e8e8f4;
            --bg-card: rgba(255,255,255,0.85);
            --bg-card-hover: rgba(255,255,255,1);
            --bg-glass: rgba(255,255,255,0.7);
            --border-color: rgba(0,0,0,0.08);
            --border-hover: rgba(108,92,231,0.3);
            --text-primary: #1a1a2e;
            --text-secondary: #555577;
            --text-muted: #8888aa;
            --glow-1: rgba(108,92,231,0.15);
            --shadow-card: 0 8px 32px rgba(0,0,0,0.08);
            --shadow-card-hover: 0 20px 60px rgba(0,0,0,0.15);
            --navbar-bg: rgba(240,240,248,0.85);
            --ticker-bg: rgba(244,63,94,0.08);
            --detail-bg: #ffffff;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Inter',-apple-system,sans-serif; background:var(--bg-primary); color:var(--text-primary);
            min-height:100vh; overflow-x:hidden; transition:background .5s,color .5s;
        }
        .bg-animated {
            position:fixed; inset:0; z-index:0; background:linear-gradient(135deg,#0a0a1a 0%,#1a1040 25%,#0d1b3e 50%,#1a0a2e 75%,#0a0a1a 100%);
            background-size:400% 400%; animation:gradientShift 15s ease infinite;
        }
        [data-theme="light"] .bg-animated { background:linear-gradient(135deg,#f0f0f8 0%,#e8e0f8 25%,#e0e8f8 50%,#f0e8f8 75%,#f0f0f8 100%); background-size:400% 400%; }
        @keyframes gradientShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        
        #progress-bar { position:fixed; top:0; left:0; height:3px; z-index:9999; background:linear-gradient(90deg,var(--accent-1),var(--accent-2),var(--accent-3)); width:0%; transition:width .1s linear; }
        .navbar { position:sticky; top:0; z-index:100; background:var(--navbar-bg); backdrop-filter:blur(20px); border-bottom:1px solid var(--border-color); padding:0 2rem; height:64px; display:flex; align-items:center; justify-content:space-between; transition:background .5s; }
        .navbar-brand { display:flex; align-items:center; gap:10px; font-weight:900; font-size:1.3rem; letter-spacing:-.5px; background:linear-gradient(135deg,var(--accent-1),var(--accent-3)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .navbar-brand .dot { width:10px;height:10px;border-radius:50%;background:var(--accent-4);animation:pulse-dot 2s ease infinite;box-shadow:0 0 8px var(--accent-4); }
        @keyframes pulse-dot { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.4);opacity:.6} }
        .theme-toggle { width:42px;height:42px;border-radius:14px;border:1px solid var(--border-color); background:var(--bg-glass);cursor:pointer;font-size:1.1rem; display:flex;align-items:center;justify-content:center;transition:all .3s; }
        .theme-toggle:hover { border-color:var(--accent-2);transform:rotate(20deg) scale(1.1); }

        .category-nav { display: flex; gap: 10px; padding: 14px 2rem; background: var(--navbar-bg); border-bottom: 1px solid var(--border-color); overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; position: sticky; top: 64px; z-index: 99; backdrop-filter: blur(20px); }
        .category-nav::-webkit-scrollbar { display: none; }
        .cat-btn { background: var(--bg-glass); border: 1px solid var(--border-color); color: var(--text-primary); font-weight: 600; font-size: 0.85rem; padding: 8px 18px; border-radius: 20px; cursor: pointer; transition: all 0.3s ease; }
        .cat-btn:hover { background: var(--bg-card-hover); transform: translateY(-2px); }
        .cat-btn.active { background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); color: #fff; border-color: transparent; box-shadow: 0 4px 15px var(--glow-1); }

        .ticker-wrap { background:var(--ticker-bg); border-bottom:1px solid var(--border-color); overflow:hidden; height:42px; display:flex; align-items:center; position:relative; z-index:10; }
        .ticker-label { background:linear-gradient(135deg,var(--accent-4),var(--accent-3)); color:#fff; font-weight:800; font-size:.68rem; letter-spacing:1px; padding:4px 14px; border-radius:6px; margin-left:16px; white-space:nowrap; text-transform:uppercase; z-index:2; flex-shrink:0; }
        .ticker-track { display:flex; animation:tickerScroll 240s linear infinite; white-space:nowrap; margin-left:20px; }
        .ticker-track:hover { animation-play-state:paused; }
        .ticker-item { color:var(--text-secondary);font-size:.82rem;font-weight:500;padding:0 2.5rem;position:relative; cursor:pointer; transition:color 0.3s; }
        .ticker-item:hover { color:var(--accent-2); }
        .ticker-item::before { content:'◆';position:absolute;left:0;color:var(--accent-2);font-size:.5rem;top:50%;transform:translateY(-50%); }
        @keyframes tickerScroll { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }

        .main-container { position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:2rem 1.5rem 4rem; }
        .news-list { display:flex; flex-direction:column; gap:1.2rem; margin-top:1rem; }
        
        .news-card { position:relative; background:var(--bg-card); border:1px solid var(--border-color); border-radius:18px; padding:1.5rem; cursor:pointer; transition:all .3s ease; display:flex; gap:1.2rem; align-items:center; }
        .news-card:hover { transform:translateY(-4px); border-color:var(--border-hover); box-shadow:var(--shadow-card-hover),0 0 25px var(--glow-1); background:var(--bg-card-hover); }
        
        .card-img-wrapper { width: 140px; height: 95px; border-radius: 12px; overflow: hidden; flex-shrink: 0; background: var(--bg-glass); }
        .card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
        .news-card:hover .card-img { transform: scale(1.06); }

        .card-content { display: flex; flex-direction: column; gap: 0.5rem; flex: 1; min-width: 0; }
        .card-meta { display:flex; align-items:center; gap:12px; }
        .card-cat-badge { background:linear-gradient(135deg, var(--accent-2), var(--accent-1)); color:#fff; font-size:.65rem; font-weight:800; padding:3px 10px; border-radius:6px; text-transform:uppercase; letter-spacing:0.5px; }
        .card-date-badge { color:var(--text-muted); font-size:.75rem; font-weight:600; }
        
        .card-title { font-size:1.1rem; font-weight:800; line-height:1.4; color:var(--text-primary); transition:color .3s; }
        .news-card:hover .card-title { color:var(--accent-2); }
        .card-desc { font-size:0.88rem; color:var(--text-secondary); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        
        #detay-sayfasi { display:none; }
        #detay-sayfasi.active { display:block; }
        #ana-sayfa.hidden-page { display:none; }
        
        .detail-container { max-width:820px;margin:0 auto;background:var(--detail-bg); border-radius:24px;border:1px solid var(--border-color);overflow:hidden;box-shadow:var(--shadow-card); padding:3rem 2.5rem; }
        .detail-meta { display:flex; align-items:center; gap:12px; margin-bottom:1.5rem; }
        .detail-date { background:linear-gradient(135deg,var(--accent-4),var(--accent-3)); color:#fff;font-size:.75rem;font-weight:800;padding:4px 12px;border-radius:6px; }
        .detail-title { font-family:'Playfair Display',serif;font-size:clamp(1.6rem,3.5vw,2.4rem); font-weight:900;color:var(--text-primary);line-height:1.3;margin-bottom:1.5rem; }
        
        .detail-img-wrapper { width: 100%; max-height: 420px; border-radius: 16px; overflow: hidden; margin-bottom: 2rem; background: var(--bg-glass); }
        .detail-img { width: 100%; height: 100%; max-height: 420px; object-fit: cover; display: block; }

        .detail-body { font-size: 1.05rem; line-height: 1.9; color: var(--text-secondary); }
        .detail-body p { margin-bottom: 1.5rem; }
        .detail-body h2, .detail-body h3 { font-family: 'Playfair Display', serif; color: var(--text-primary); font-weight: 800; margin: 2rem 0 1rem 0; }
        .detail-body img { display: none !important; }

        .back-btn { display:inline-flex;align-items:center;gap:8px;padding:10px 22px;margin-bottom:1.5rem; background:var(--bg-glass);border:1px solid var(--border-color);border-radius:14px; color:var(--text-primary);font-weight:700;font-size:.88rem;cursor:pointer; transition:all .3s; }
        .back-btn:hover { border-color:var(--accent-2);color:var(--accent-2);transform:translateX(-4px); }
        .error-state { text-align:center; padding:3rem; color:var(--text-muted); font-size:1rem; }
        
        ::-webkit-scrollbar { width:8px; }
        ::-webkit-scrollbar-track { background:var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background:linear-gradient(var(--accent-1),var(--accent-3));border-radius:10px; }

        @media(max-width: 600px) {
            .news-card { flex-direction: column; align-items: stretch; }
            .card-img-wrapper { width: 100%; height: 180px; }
        }
    </style>
</head>
<body>
    <div class="bg-animated"></div>
    <div id="progress-bar"></div>

    <nav class="navbar">
        <div class="navbar-brand"><div class="dot"></div>Connect Plus Spor</div>
        <div class="navbar-right">
            <button class="theme-toggle" id="theme-toggle" title="Tema Değiştir">🌙</button>
        </div>
    </nav>

    <!-- Güncellenmiş Fotomaç Kategori Butonları -->
    <div class="category-nav" id="category-nav">
        <button class="cat-btn active" onclick="kategoriSec('anasayfa', 'Anasayfa', this)">Anasayfa</button>
        <button class="cat-btn" onclick="kategoriSec('basketbol', 'Basketbol', this)">Basketbol</button>
        <button class="cat-btn" onclick="kategoriSec('son24saat', 'Son 24 Saat', this)">Son 24 Saat</button>
        <button class="cat-btn" onclick="kategoriSec('superlig', 'Süper Lig', this)">Süper Lig</button>
        <button class="cat-btn" onclick="kategoriSec('galatasaray', 'Galatasaray', this)">Galatasaray</button>
        <button class="cat-btn" onclick="kategoriSec('fenerbahce', 'Fenerbahçe', this)">Fenerbahçe</button>
        <button class="cat-btn" onclick="kategoriSec('besiktas', 'Beşiktaş', this)">Beşiktaş</button>
    </div>

    <div class="ticker-wrap" id="ticker-wrap" style="display:none;">
        <span class="ticker-label">⚡ Son Dakika</span>
        <div class="ticker-track" id="ticker-track"></div>
    </div>

    <div class="main-container">
        <div id="ana-sayfa">
            <div class="news-list" id="haberler-listesi"></div>
        </div>

        <div id="detay-sayfasi">
            <button class="back-btn" onclick="geriDon()">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
                Haberlere Dön
            </button>
            <div class="detail-container">
                <div class="detail-meta">
                    <span class="detail-date" id="detay-tarih"></span>
                    <span style="color:var(--text-muted); font-size:0.85rem;" id="detay-kategori"></span>
                </div>
                <h1 class="detail-title" id="detay-baslik"></h1>
                <div class="detail-img-wrapper" id="detay-img-container" style="display:none;">
                    <img class="detail-img" id="detay-resim" src="" alt="">
                </div>
                <div class="detail-body" id="detay-icerik"></div>
            </div>
        </div>
    </div>

    <script>
        const themeBtn = document.getElementById('theme-toggle');
        const saved = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', saved);
        themeBtn.textContent = saved === 'dark' ? '🌙' : '☀️';
        themeBtn.addEventListener('click', () => {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            themeBtn.textContent = next === 'dark' ? '🌙' : '☀️';
        });

        window.addEventListener('scroll', () => {
            const st = window.scrollY, dh = document.documentElement.scrollHeight - window.innerHeight;
            document.getElementById('progress-bar').style.width = (dh > 0 ? (st / dh) * 100 : 0) + '%';
        });

        let globalKategoriler = {};
        let aktifKey = 'anasayfa';
        let aktifGorunenKategori = 'Anasayfa';

        async function haberleriGetir(){
            try {
                const response = await fetch('https://raw.githubusercontent.com/connectplus78/cop/refs/heads/main/news.json?t=' + new Date().getTime());
                const data = await response.json();
                
                globalKategoriler = data.categories || data;
                
                const anasayfaHaberleri = globalKategoriler['anasayfa'] || [];
                if(anasayfaHaberleri.length > 0){
                    document.getElementById('ticker-wrap').style.display = 'flex';
                    const items = anasayfaHaberleri.slice(0, 10).map(h => `<span class="ticker-item" onclick="haberOkuLink('${h.link}')">${h.title}</span>`).join('');
                    document.getElementById('ticker-track').innerHTML = items.repeat(4);
                }
                
                kategoriSec('anasayfa', 'Anasayfa', document.querySelector('.cat-btn'));
            } catch(hata){
                console.error(hata);
                document.getElementById('haberler-listesi').innerHTML = `<div class="error-state"><p>Haberler yüklenemedi. news.json dosyası henüz GitHub üzerinde oluşmamış veya bot çalışmamış olabilir.</p></div>`;
            }
        }

        function kategoriSec(key, kategoriAdi, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            aktifKey = key;
            aktifGorunenKategori = kategoriAdi;
            
            const haberler = globalKategoriler[key] || [];
            haberleriEkranaCiz(haberler);
        }

        function haberleriEkranaCiz(haberDizisi) {
            const kapsayici = document.getElementById('haberler-listesi');
            if (!haberDizisi || haberDizisi.length === 0) {
                kapsayici.innerHTML = `<div class="error-state"><p>Bu kategoride henüz haber bulunmuyor.</p></div>`;
                return;
            }

            kapsayici.innerHTML = haberDizisi.map((haber) => {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = haber.description || '';
                
                const imgs = tempDiv.getElementsByTagName('img');
                while(imgs.length > 0) {
                    imgs[0].parentNode.removeChild(imgs[0]);
                }
                
                let temizAciklama = tempDiv.textContent || tempDiv.innerText || '';
                if(temizAciklama.length > 160) temizAciklama = temizAciklama.substring(0, 160) + '...';

                const tarihStr = haber.pubDate || haber.pub_date;
                const formatliTarih = tarihStr ? new Date(tarihStr).toLocaleDateString('tr-TR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : 'Yeni';

                const gorselHtml = haber.image ? `
                    <div class="card-img-wrapper">
                        <img class="card-img" src="${haber.image}" alt="${haber.title}" loading="lazy">
                    </div>
                ` : '';

                return `
                <div onclick="haberOku('${encodeURIComponent(haber.link)}')" class="news-card">
                    ${gorselHtml}
                    <div class="card-content">
                        <div class="card-meta">
                            <span class="card-cat-badge">${aktifGorunenKategori}</span>
                            <span class="card-date-badge">${formatliTarih}</span>
                        </div>
                        <h2 class="card-title">${haber.title}</h2>
                        <p class="card-desc">${temizAciklama}</p>
                    </div>
                </div>`;
            }).join('');
        }

        function haberOkuLink(link) {
            haberOku(encodeURIComponent(link));
        }

        function haberOku(encodedLink){
            const link = decodeURIComponent(encodedLink);
            const haberler = globalKategoriler[aktifKey] || [];
            const haber = haberler.find(h => h.link === link);
            
            if(!haber) return;

            document.getElementById('detay-baslik').innerText = haber.title;
            const tarihStr = haber.pubDate || haber.pub_date;
            document.getElementById('detay-tarih').innerText = tarihStr ? new Date(tarihStr).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'}) : '';
            document.getElementById('detay-kategori').innerText = aktifGorunenKategori;
            
            const imgContainer = document.getElementById('detay-img-container');
            const imgElement = document.getElementById('detay-resim');
            if(haber.image) {
                imgElement.src = haber.image;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.style.display = 'none';
            }

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = haber.description || '<p>İçerik bulunamadı.</p>';
            const imgs = tempDiv.getElementsByTagName('img');
            while(imgs.length > 0) {
                imgs[0].parentNode.removeChild(imgs[0]);
            }
            document.getElementById('detay-icerik').innerHTML = tempDiv.innerHTML;
            
            document.getElementById('ana-sayfa').classList.add('hidden-page');
            document.getElementById('category-nav').style.display = 'none'; 
            
            document.getElementById('detay-sayfasi').classList.add('active');
            window.scrollTo({top:0,behavior:'smooth'});
        }

        function geriDon(){
            document.getElementById('detay-sayfasi').classList.remove('active');
            document.getElementById('category-nav').style.display = 'flex'; 
            document.getElementById('ana-sayfa').classList.remove('hidden-page');
            window.scrollTo({top:0,behavior:'smooth'});
        }
        
        haberleriGetir();
    </script>
</body>
</html>
