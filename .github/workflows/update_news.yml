name: NTV Spor RSS Bot

on:
  schedule:
    # Her 3 saatte bir otomatik çalışır (cron syntax)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Manuel olarak Actions sekmesinden tetiklenebilmesini sağlar

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Botu Çalıştır
        run: python bot.py

      - name: Değişiklikleri Kaydet ve Gönder (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "Otomatik Haber Güncellemesi: $(date -u)" && git push)
